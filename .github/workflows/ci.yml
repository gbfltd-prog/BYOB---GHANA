name: CI
on:
  push:
    branches: [ main, master, '**' ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
      - run: npm run -ws --if-present build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: |
          services=(auth-service product-service warehouse-service order-service wallet-service chat-service employability-service file-service)
          for svc in "${services[@]}"; do
            docker build -t ghcr.io/${{ github.repository }}/byob-$svc:latest -f apps/$svc/Dockerfile .
            docker push ghcr.io/${{ github.repository }}/byob-$svc:latest
          done
