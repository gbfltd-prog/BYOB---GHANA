name: BYOB CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  build-services:
    runs-on: ubuntu-latest
    needs: install
    strategy:
      matrix:
        service:
          - auth-service
          - product-service
          - order-service
          - warehouse-service
          - wallet-service
          - chat-service
          - employability-service
          - file-service
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.service }}
        run: pnpm --filter @byob/${{ matrix.service }} build

  build-web:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @byob/admin-web build
      - run: pnpm --filter @byob/manufacturer-portal build

  docker-images:
    runs-on: ubuntu-latest
    needs: [build-services, build-web]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push auth-service image
        run: |
          docker build -f apps/auth-service/Dockerfile -t ghcr.io/${{ github.repository }}/auth-service:latest .
          docker push ghcr.io/${{ github.repository }}/auth-service:latest
      # Repeat for other services as needed
