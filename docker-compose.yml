version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: byob
      POSTGRES_PASSWORD: byob
      POSTGRES_DB: byob
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  auth-service:
    image: node:20
    working_dir: /app/apps/auth-service
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm --workspace @byob/db run prisma:generate && npm --workspace @byob/db run prisma:migrate && npm run --workspace auth-service dev"
    environment:
      DATABASE_URL: postgresql://byob:byob@postgres:5432/byob?schema=public
      JWT_SECRET: dev-secret
    ports: ["3001:3001"]
    depends_on: [postgres]

  product-service:
    image: node:20
    working_dir: /app/apps/product-service
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run --workspace product-service dev"
    environment:
      DATABASE_URL: postgresql://byob:byob@postgres:5432/byob?schema=public
      JWT_SECRET: dev-secret
    ports: ["3002:3002"]
    depends_on: [postgres]

  warehouse-service:
    image: node:20
    working_dir: /app/apps/warehouse-service
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run --workspace warehouse-service dev"
    environment:
      DATABASE_URL: postgresql://byob:byob@postgres:5432/byob?schema=public
      JWT_SECRET: dev-secret
    ports: ["3003:3003"]
    depends_on: [postgres]

  order-service:
    image: node:20
    working_dir: /app/apps/order-service
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run --workspace order-service dev"
    environment:
      DATABASE_URL: postgresql://byob:byob@postgres:5432/byob?schema=public
      JWT_SECRET: dev-secret
    ports: ["3004:3004"]
    depends_on: [postgres]

  wallet-service:
    image: node:20
    working_dir: /app/apps/wallet-service
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run --workspace wallet-service dev"
    environment:
      DATABASE_URL: postgresql://byob:byob@postgres:5432/byob?schema=public
      JWT_SECRET: dev-secret
    ports: ["3005:3005"]
    depends_on: [postgres]

  chat-service:
    image: node:20
    working_dir: /app/apps/chat-service
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run --workspace chat-service dev"
    environment:
      DATABASE_URL: postgresql://byob:byob@postgres:5432/byob?schema=public
      JWT_SECRET: dev-secret
      REDIS_URL: redis://redis:6379
    ports: ["3006:3006"]
    depends_on: [postgres, redis]

  employability-service:
    image: node:20
    working_dir: /app/apps/employability-service
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run --workspace employability-service dev"
    environment:
      DATABASE_URL: postgresql://byob:byob@postgres:5432/byob?schema=public
      JWT_SECRET: dev-secret
      REDIS_URL: redis://redis:6379
    ports: ["3007:3007"]
    depends_on: [postgres, redis]

  file-service:
    image: node:20
    working_dir: /app/apps/file-service
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run --workspace file-service dev"
    environment:
      JWT_SECRET: dev-secret
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: byob
    ports: ["3008:3008"]
    depends_on: [minio]

volumes:
  pgdata:
  minio:
