version: "3.9"
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: byob
      POSTGRES_USER: byob
      POSTGRES_PASSWORD: byob
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    environment:
      DATABASE_URL: postgres://byob:byob@postgres:5432/byob
      JWT_SECRET: super-secret
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    environment:
      DATABASE_URL: postgres://byob:byob@postgres:5432/byob
      JWT_SECRET: super-secret
      SHARE_BASE_URL: https://byob.africa/share
    ports:
      - "3002:3002"
    depends_on:
      - postgres

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    environment:
      DATABASE_URL: postgres://byob:byob@postgres:5432/byob
      JWT_SECRET: super-secret
    ports:
      - "3003:3003"
    depends_on:
      - postgres

  warehouse-service:
    build:
      context: .
      dockerfile: apps/warehouse-service/Dockerfile
    environment:
      DATABASE_URL: postgres://byob:byob@postgres:5432/byob
      JWT_SECRET: super-secret
    ports:
      - "3004:3004"
    depends_on:
      - postgres

  wallet-service:
    build:
      context: .
      dockerfile: apps/wallet-service/Dockerfile
    environment:
      DATABASE_URL: postgres://byob:byob@postgres:5432/byob
      JWT_SECRET: super-secret
    ports:
      - "3005:3005"
    depends_on:
      - postgres

  chat-service:
    build:
      context: .
      dockerfile: apps/chat-service/Dockerfile
    environment:
      DATABASE_URL: postgres://byob:byob@postgres:5432/byob
      JWT_SECRET: super-secret
    ports:
      - "3006:3006"
    depends_on:
      - postgres

  employability-service:
    build:
      context: .
      dockerfile: apps/employability-service/Dockerfile
    environment:
      DATABASE_URL: postgres://byob:byob@postgres:5432/byob
      JWT_SECRET: super-secret
      CERT_BASE_URL: https://cdn.byob.africa/certs
    ports:
      - "3007:3007"
    depends_on:
      - postgres

  file-service:
    build:
      context: .
      dockerfile: apps/file-service/Dockerfile
    environment:
      JWT_SECRET: super-secret
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: byob
      MINIO_PUBLIC_URL: http://localhost:9000
    ports:
      - "3008:3008"
    depends_on:
      - minio

volumes:
  postgres-data:
  minio-data:
