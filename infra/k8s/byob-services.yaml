apiVersion: v1
kind: Namespace
metadata:
  name: byob
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: byob-config
  namespace: byob
data:
  DATABASE_URL: postgres://byob:byob@postgres.byob:5432/byob
  JWT_SECRET: super-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: byob
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/klloyds/byob-auth:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: byob-config
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: byob
spec:
  selector:
    app: auth-service
  ports:
    - port: 80
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: byob
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: ghcr.io/klloyds/byob-product:latest
          ports:
            - containerPort: 3002
          env:
            - name: SHARE_BASE_URL
              value: https://byob.africa/p
          envFrom:
            - configMapRef:
                name: byob-config
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: byob
spec:
  selector:
    app: product-service
  ports:
    - port: 80
      targetPort: 3002
