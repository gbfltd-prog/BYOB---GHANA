apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: byob
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      containers:
        - name: file-service
          image: ghcr.io/klloyds/byob-file:latest
          ports:
            - containerPort: 3008
          env:
            - name: MINIO_ENDPOINT
              value: minio.byob
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: access
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: secret
            - name: MINIO_BUCKET
              value: byob
            - name: JWT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: byob-config
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: byob
spec:
  selector:
    app: file-service
  ports:
    - port: 80
      targetPort: 3008
